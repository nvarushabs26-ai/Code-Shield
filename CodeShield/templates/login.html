{% extends "base.html" %}
{% block title %}Login – CodeShield{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <svg class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
            <h2>Sign In to CodeShield</h2>
            <p>Access your security scan history and project reports</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="developer@company.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Sign In</button>

            <div class="auth-footer">
                <span>Don't have an account?</span>
                <a href="{{ url_for('register') }}" class="link-cyan">Create Account</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
